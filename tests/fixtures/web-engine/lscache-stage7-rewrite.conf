# Synthetic staging fixture only; NOT a production configuration.
# Use with a verified cache-disabled default and trusted origin response policy.
# Only the exact anonymous GET /public is eligible for cache lookup.
rewrite {
 enable 1
 autoLoadHtaccess 0
 rules <<<END_rules
RewriteCond %{REQUEST_METHOD} ^GET$
RewriteCond %{REQUEST_URI} ^/public$
RewriteCond %{HTTP_COOKIE} ^$
RewriteCond %{HTTP:Authorization} ^$
RewriteCond %{QUERY_STRING} ^$
RewriteCond %{HTTP:Cache-Control} ^$
RewriteCond %{HTTP:Pragma} ^$
RewriteRule .* - [L]
RewriteRule .* - [E=modcache:0,E=cache-control:no-cache,L]
END_rules
}
